    } catch (e) { /* storage unavailable */ }
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cp-bg); color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
}
a { color: var(--cp-link); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: Consolas, "Courier New", Courier, monospace; }
h1, h2, h3 { margin: 0; line-height: 1.2; }
h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 650; }
h3 { font-size: 14px; font-weight: 650; }
p { margin: 0; }
.muted { color: var(--cp-text-muted); }
.soft { color: var(--cp-text-soft); }
.small { font-size: 12px; }
.tiny { font-size: 11px; }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.stack.lg { gap: 16px; }
.spacer { flex: 1; }
.hidden { display: none !important; }

/* top bar */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px;
  padding: 10px 24px; background: var(--cp-panel-strong); border-bottom: 1px solid var(--cp-border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; color: var(--cp-text); }
.brand:hover { text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs a { padding: 7px 12px; border-radius: 0.625rem; color: var(--cp-text-muted); font-weight: 550; }
.tabs a:hover { background: var(--cp-surface-soft); color: var(--cp-text); text-decoration: none; }
.tabs a.active { background: var(--cp-accent-soft); color: var(--cp-accent); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.acting { white-space: nowrap; }
#actingAs { max-width: 220px; }
.acting { display: flex; align-items: center; gap: 6px; color: var(--cp-text-muted); font-size: 12px; }

.container { max-width: 1320px; margin: 0 auto; padding: 22px 24px 40px; display: flex; flex-direction: column; gap: 18px; }
.footer { max-width: 1320px; margin: 0 auto; padding: 0 24px 28px; color: var(--cp-text-soft); font-size: 12px; }

/* cards & grids */
.card {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; padding: 18px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.card > h2 { margin-bottom: 12px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 18px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.wide-left { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.grid.wide-right { grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); }
@media (max-width: 1000px) { .grid.two, .grid.three, .grid.wide-left, .grid.wide-right { grid-template-columns: 1fr; } }

/* buttons & inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 0.625rem;
  border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text); font: inherit; font-weight: 600;
  cursor: pointer; text-decoration: none; transition: background 0.12s, border-color 0.12s;
}
.btn:hover { background: var(--cp-surface-soft); text-decoration: none; }
.btn.primary { background: var(--cp-accent); border-color: var(--cp-accent); color: var(--cp-accent-fg); }
.btn.primary:hover { background: var(--cp-accent-hover); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--cp-danger); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn { border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text); border-radius: 0.625rem; width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
select, input[type="text"], input[type="number"] {
  font: inherit; color: var(--cp-text); background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 0.625rem; padding: 6px 10px;
}
input[type="range"] { accent-color: var(--cp-accent); }
input[type="checkbox"] { accent-color: var(--cp-accent); width: 16px; height: 16px; }
label.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
label.check input { margin-top: 2px; flex: none; }

/* pills, badges */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--cp-surface-soft); color: var(--cp-text-muted); border: 1px solid var(--cp-border); white-space: nowrap; }
.pill.accent { background: var(--cp-accent-soft); color: var(--cp-accent); border-color: transparent; }
.pill.ok { color: var(--cp-success); }
.pill.bad { color: var(--cp-danger); }
.pill.warn { color: var(--cp-warning); }
.pill.link { color: var(--cp-link); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--cp-text-soft); flex: none; }
.dot.ok { background: var(--cp-success); } .dot.bad { background: var(--cp-danger); } .dot.warn { background: var(--cp-warning); }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: var(--cp-accent-soft); color: var(--cp-accent); flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 16px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; padding: 26px; background: var(--cp-bg-elevated); }
.hero p.lead { font-size: 15px; color: var(--cp-text-muted); margin: 10px 0 18px; max-width: 760px; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px; font-weight: 700; color: var(--cp-accent); margin-bottom: 8px; }
.hero-side { display: flex; flex-direction: column; justify-content: center; gap: 10px; border-left: 1px solid var(--cp-border); padding-left: 24px; }
.hero-metric { display: flex; align-items: baseline; gap: 10px; }
.hero-metric .big { font-size: 34px; font-weight: 700; }
.delta.up { color: var(--cp-success); font-weight: 650; } .delta.down { color: var(--cp-danger); font-weight: 650; }
@media (max-width: 1000px) { .hero { grid-template-columns: 1fr; } .hero-side { border-left: 0; padding-left: 0; } }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px 16px; box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14); }
.kpi .label { font-size: 12px; color: var(--cp-text-muted); }
.kpi .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.kpi .sub { font-size: 11.5px; color: var(--cp-text-soft); }

/* bars */
.bar { height: 8px; background: var(--cp-surface-soft); border-radius: 999px; overflow: hidden; border: 1px solid var(--cp-border); }
.bar > span { display: block; height: 100%; background: var(--cp-accent); border-radius: 999px; }
.bar.ok > span { background: var(--cp-success); } .bar.warn > span { background: var(--cp-warning); } .bar.bad > span { background: var(--cp-danger); }
.skill-row { display: grid; grid-template-columns: 150px 1fr 54px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--cp-border); }
.skill-row:last-child { border-bottom: 0; }

/* tables */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--cp-border); vertical-align: top; }
th { font-size: 11.5px; color: var(--cp-text-muted); font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; }
tr:last-child td { border-bottom: 0; }
.table-wrap { overflow-x: auto; }

/* loop diagram */
.loop-svg { width: 100%; height: auto; display: block; max-width: 600px; margin: 0 auto; }
.loop-ring { fill: none; stroke: var(--cp-border-strong); stroke-width: 2; stroke-dasharray: 6 8; }
.loop-ring.flow { animation: flow 1.2s linear infinite; stroke: var(--cp-accent); }
@keyframes flow { to { stroke-dashoffset: -28; } }
.loop-arrow { fill: var(--cp-border-strong); }
.loop-node rect { fill: var(--cp-surface); stroke: var(--cp-border); stroke-width: 1.5; transition: fill 0.2s, stroke 0.2s; }
.loop-node.active rect { fill: var(--cp-accent-soft); stroke: var(--cp-accent); stroke-width: 2.5; }
.loop-node .n-label { font-size: 11.5px; font-weight: 700; color: var(--cp-text); }
.loop-node .n-value { font-size: 12.5px; font-weight: 600; color: var(--cp-accent); }
.loop-node .n-sub { font-size: 10.5px; color: var(--cp-text-muted); line-height: 1.25; }
.loop-node .n-box { padding: 6px 8px; height: 100%; overflow: hidden; }
.loop-center-big { font-size: 40px; font-weight: 750; fill: var(--cp-text); }
.loop-center-small { font-size: 13px; fill: var(--cp-text-muted); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid-line { stroke: var(--cp-border); stroke-width: 1; }
.chart text { fill: var(--cp-text-muted); font-size: 11px; font-family: "Segoe UI", Aptos, Calibri, sans-serif; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--cp-text-muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* feed */
.feed { display: flex; flex-direction: column; max-height: 360px; overflow-y: auto; }
.feed-item { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--cp-border); font-size: 13px; }
.feed-item:last-child { border-bottom: 0; }
.feed-item .when { font-size: 11.5px; color: var(--cp-text-soft); white-space: nowrap; }

/* bounties */
.bounty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.bounty { border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--cp-surface); }
.bounty.k-intervention { border-color: var(--cp-accent); box-shadow: inset 3px 0 0 var(--cp-accent); }
.bounty .rate { margin-left: auto; font-size: 18px; font-weight: 750; color: var(--cp-text); }
.bounty .rate small { font-size: 11px; font-weight: 600; color: var(--cp-text-muted); }
.bounty .title { font-weight: 650; }
.bounty .reason { font-size: 12.5px; color: var(--cp-text-muted); flex: 1; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--cp-border); background: var(--cp-surface); cursor: pointer; font: inherit; font-size: 12.5px; color: var(--cp-text-muted); }
.chip.on { background: var(--cp-accent-soft); color: var(--cp-accent); border-color: transparent; font-weight: 600; }

/* teleop */
.teleop { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
@media (max-width: 1100px) { .teleop { grid-template-columns: 1fr; } }
.scene-wrap { position: relative; }
.scene { width: 100%; display: block; border-radius: 12px; border: 1px solid var(--cp-border); background: var(--cp-surface-soft); cursor: crosshair; touch-action: none; }
.scene:focus { outline: none; }
.scene:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 2px; }
.scene-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.scene-overlay .msg { background: var(--cp-overlay); border: 1px solid var(--cp-border); border-radius: 16px; padding: 14px 20px; font-weight: 650; font-size: 16px; text-align: center; box-shadow: var(--cp-shadow); }
.hud { align-items: center; padding: 10px 2px 0; font-size: 12.5px; }
.gauge { position: relative; height: 12px; border-radius: 999px; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); overflow: hidden; }
.gauge > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--cp-success); transition: width 0.05s linear; }
.gauge > span.warn { background: var(--cp-warning); } .gauge > span.bad { background: var(--cp-danger); }
.gauge > i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--cp-danger); }
.kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--cp-border-strong); border-bottom-width: 2px; border-radius: 6px; font-family: Consolas, monospace; font-size: 11.5px; background: var(--cp-surface-soft); }
.metric { display: grid; grid-template-columns: 110px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.paylines { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.paylines div { display: flex; justify-content: space-between; }
.paylines .total { border-top: 1px solid var(--cp-border); padding-top: 6px; font-weight: 700; }
.callout { border-radius: 12px; padding: 10px 12px; background: var(--cp-accent-soft); color: var(--cp-text); font-size: 13px; }
.callout.neutral { background: var(--cp-surface-soft); }

/* glasses */
.source-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 800px) { .source-grid { grid-template-columns: 1fr; } }
.source { border: 1px solid var(--cp-border); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--cp-surface); text-align: left; font: inherit; color: var(--cp-text); }
.source.on { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.thumbs img { width: 100%; border-radius: 8px; border: 1px solid var(--cp-border); display: block; }
.step-num { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--cp-accent); color: var(--cp-accent-fg); font-size: 12px; font-weight: 700; flex: none; }

/* toggles */
.toggle-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--cp-border); }
.toggle-row:last-child { border-bottom: 0; }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--cp-border-strong); border-radius: 999px; cursor: pointer; transition: background 0.15s; }
.switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: var(--cp-surface); border-radius: 50%; transition: transform 0.15s; }
.switch input:checked + span { background: var(--cp-accent); }
.switch input:checked + span::before { transform: translateX(16px); }
.switch input:disabled + span { opacity: 0.6; cursor: not-allowed; }

/* robots */
.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.site { border: 1px solid var(--cp-border); border-radius: 12px; padding: 12px; }
.robot { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 0; }

/* toasts & modal */
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: 380px; }
.toast { background: var(--cp-panel-strong); border: 1px solid var(--cp-border); border-left: 4px solid var(--cp-accent); border-radius: 12px; padding: 10px 14px; box-shadow: var(--cp-shadow); font-size: 13px; animation: pop 0.18s ease-out; }
.toast.ok { border-left-color: var(--cp-success); } .toast.bad { border-left-color: var(--cp-danger); }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-back { position: fixed; inset: 0; background: var(--cp-overlay); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal { background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px; box-shadow: var(--cp-shadow); width: min(720px, 100%); max-height: 90vh; overflow-y: auto; padding: 20px; }
.modal.wide { width: min(980px, 100%); }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.loading { padding: 40px; text-align: center; color: var(--cp-text-muted); }
.spinner { width: 22px; height: 22px; border: 3px solid var(--cp-border); border-top-color: var(--cp-accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { padding: 18px; text-align: center; color: var(--cp-text-muted); border: 1px dashed var(--cp-border); border-radius: 12px; }
.checklist { display: flex; flex-direction: column; gap: 6px; }
.checklist a, .checklist div { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--cp-border); color: var(--cp-text); }
.checklist .done { color: var(--cp-text-muted); text-decoration: line-through; }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--cp-border-strong); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
.tick.on { background: var(--cp-success); border-color: var(--cp-success); color: var(--cp-surface); }
.prose { max-width: 860px; }
.prose p, .prose li { color: var(--cp-text-muted); font-size: 14px; }
.prose h2 { margin: 18px 0 8px; }
.prose ul { padding-left: 20px; margin: 6px 0; }

/* loop as a list (narrow screens) */
.loop-list { display: none; list-style: none; margin: 0; padding: 0; }
.loop-list .loop-node { border: 1px solid var(--cp-border); border-radius: 12px; margin-bottom: 8px; background: var(--cp-surface); transition: background 0.2s, border-color 0.2s; }
.loop-list .loop-node.active { background: var(--cp-accent-soft); border-color: var(--cp-accent); }
.loop-list .n-box { height: auto; padding: 8px 12px; }
.loop-list .n-sub { font-size: 12px; }

/* teleop controls */
.hud { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.hud-gauge { flex: 1 1 200px; min-width: 0; }
.teleop-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn[aria-pressed="true"] { background: var(--cp-accent-soft); border-color: var(--cp-accent); color: var(--cp-accent); }

/* phones */
@media (max-width: 1000px) {
  .grid.two, .grid.three, .grid.wide-left, .grid.wide-right, .hero { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1100px) { .teleop { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 1399px) {
  .topbar { flex-wrap: wrap; gap: 6px 10px; padding-bottom: 0; }
  .tabs { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -24px; padding: 0 24px 8px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs a { white-space: nowrap; }
}
@media (max-width: 760px) {
  .topbar { padding: 8px 12px 0; }
  .topbar-right { gap: 6px; }
  .acting-label { display: none; }
  #actingAs { max-width: 46vw; }
  .tabs { margin: 0 -12px; padding: 0 12px 8px; }
  .tabs a { padding: 6px 10px; }
  .container { padding: 14px 12px 28px; gap: 14px; }
  .footer { padding: 0 12px 24px; }
  .card { padding: 14px; }
  .hero { padding: 18px; gap: 14px; }
  h1 { font-size: 25px; }
  .hero p.lead { font-size: 14px; }
  .hero-metric .big { font-size: 28px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi .value { font-size: 19px; }
  .skill-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 44px; }
  .bounty-grid { grid-template-columns: minmax(0, 1fr); }
  .chart text { font-size: 17px; }
  #toasts { left: 12px; right: 12px; bottom: 12px; max-width: none; }
  .scene-overlay .msg { font-size: 14px; padding: 10px 14px; margin: 0 10px; }
}
@media (max-width: 640px) {
  .loop-svg { display: none; }
  .loop-list { display: block; }
}
